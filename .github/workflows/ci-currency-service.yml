# =============================================================================
# ci-currency-service.yml — CI para el Currency Service (Fx/Currency pod)
# =============================================================================
# Triggers: cualquier push o PR que toque services/currency-service/**
#
# Jobs:
#   1. unit-tests — pytest (smoke + unit, sin infraestructura real)
#                   Bloquea el merge si falla
#
# GitHub Secrets requeridos: ninguno (los tests usan mocks)
# =============================================================================

name: CI — Currency Service

on:
  push:
    paths:
      - "services/currency-service/**"
      - ".github/workflows/ci-currency-service.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/currency-service/**"
      - ".github/workflows/ci-currency-service.yml"

jobs:
  unit-tests:
    name: Unit & Smoke Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/currency-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "services/currency-service/requirements.txt"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run pytest (smoke + unit)
        run: |
          mkdir -p reports
          python -m pytest tests/ \
            --tb=short \
            --junitxml=reports/junit.xml \
            -v

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-currency-${{ github.run_id }}
          path: services/currency-service/reports/junit.xml
          retention-days: 30
