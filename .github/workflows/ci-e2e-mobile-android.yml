name: CI - E2E Tests (Mobile Android)

on:
  push:
    branches: [main, develop]
    paths:
      - "clients/mobile-app/**"
      - ".github/workflows/ci-e2e-mobile-android.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "clients/mobile-app/**"
      - ".github/workflows/ci-e2e-mobile-android.yml"

jobs:
  e2e-android:
    name: E2E - Detox (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: clients/mobile-app/package-lock.json

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install mobile-app dependencies
        working-directory: clients/mobile-app
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('clients/mobile-app/android/**/*.gradle*', 'clients/mobile-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Create .env file for Detox build
        working-directory: clients/mobile-app
        run: |
          cat > .env << 'EOF'
          EXPO_PUBLIC_IDENTITY_URL=http://localhost:8001/api/v1
          EXPO_PUBLIC_SEARCH_URL=http://localhost:3001/api/v1
          EXPO_PUBLIC_ACCOMMODATION_URL=http://localhost:8002/api/v1
          EXPO_PUBLIC_BOOKING_URL=http://localhost:8004/api/v1
          EXPO_PUBLIC_PAYMENT_URL=http://localhost:8005/api/v1
          EXPO_PUBLIC_INVENTORY_URL=http://localhost:8006/api/v1
          EXPO_PUBLIC_WEB_APP_URL=https://d3qrdjfvzz7ms.cloudfront.net
          EOF

      - name: Start identity-service stack
        run: docker compose -f infrastructure/docker/docker-compose.identity.yml up -d --build

      - name: Wait for identity-service to be ready
        run: |
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8001/ready/db >/dev/null; then
              echo "identity-service is ready"
              exit 0
            fi
            sleep 2
          done
          echo "identity-service did not become ready in time"
          docker compose -f infrastructure/docker/docker-compose.identity.yml logs identity-service identity-db
          exit 1

      - name: Build Detox APK
        working-directory: clients/mobile-app
        run: npx detox build -c android.emu.debug

      - name: Install Android emulator system libraries
        run: sudo apt-get update && sudo apt-get install -y libpulse0

      - name: Run E2E tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          avd-name: Pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          disable-animations: true
          emulator-boot-timeout: 900
          working-directory: clients/mobile-app
          script: bash tests/e2e/run-e2e-with-mock.sh

      - name: Teardown identity-service stack
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.identity.yml down -v

      - name: Upload Detox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts-${{ github.run_id }}
          path: clients/mobile-app/artifacts/
          retention-days: 14
