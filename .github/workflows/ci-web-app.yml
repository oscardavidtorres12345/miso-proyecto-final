# =============================================================================
# ci-web-app.yml — CI para el Web App React (HU002 frontend)
# =============================================================================
# Triggers: push o PR que toque clients/web-app/**
#
# Jobs:
#   1. unit-tests  — Vitest (RTL) contra componentes React, hooks y páginas
#   2. build-check — npm run build para verificar que el bundle compila sin errores
#
# Status check para proteger main/develop:
#   Settings → Branches → main → Required status checks:
#     "CI — Web App / Unit Tests (Vitest)"
#     "CI — Web App / Build Check"
# =============================================================================

name: CI — Web App

on:
  push:
    branches: [main, develop]
    paths:
      - "clients/web-app/**"
      - ".github/workflows/ci-web-app.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "clients/web-app/**"
      - ".github/workflows/ci-web-app.yml"

defaults:
  run:
    working-directory: clients/web-app

jobs:
  # ── Job 1: Unit Tests ────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: clients/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest with coverage (threshold > 70%)
        run: npm run test:coverage -- --reporter=verbose

      - name: Upload Vitest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-${{ github.run_id }}
          path: clients/web-app/test-results/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web-app-${{ github.run_id }}
          path: clients/web-app/coverage/
          retention-days: 30

  # ── Job 2: Build Check ───────────────────────────────────────────────────────
  build-check:
    name: Build Check (tsc + vite build)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: clients/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-dist-${{ github.run_id }}
          path: clients/web-app/dist/
          retention-days: 7

