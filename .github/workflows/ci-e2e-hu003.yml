name: CI - E2E Tests (HU003)

on:
  push:
    branches: [main, develop]
    paths:
      - "clients/web-app/**"
      - "services/booking-service/**"
      - ".github/workflows/ci-e2e-hu003.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "clients/web-app/**"
      - "services/booking-service/**"
      - ".github/workflows/ci-e2e-hu003.yml"

jobs:
  e2e-hu003:
    name: E2E - Playwright (HU003)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: clients/web-app/package-lock.json

      - name: Install web-app dependencies
        working-directory: clients/web-app
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        working-directory: clients/web-app
        run: npx playwright install --with-deps chromium

      - name: Run HU003 E2E tests
        working-directory: clients/web-app
        run: npx playwright test tests/e2e/HU003/
        env:
          CI: "true"
          VITE_BOOKING_API_URL: http://127.0.0.1:8004/api/v1

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hu003-${{ github.run_id }}
          path: clients/web-app/playwright-report/
          retention-days: 30

      - name: Upload Playwright test results (traces/screenshots on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-hu003-${{ github.run_id }}
          path: clients/web-app/test-results/
          retention-days: 14
