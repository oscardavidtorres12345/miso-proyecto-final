name: CI - E2E Tests (Mobile iOS)

on:
  push:
    branches: [main, develop]
    paths:
      - "clients/mobile-app/**"
      - ".github/workflows/ci-e2e-mobile-ios.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "clients/mobile-app/**"
      - ".github/workflows/ci-e2e-mobile-ios.yml"

jobs:
  e2e-ios:
    name: E2E - Detox (iOS)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: clients/mobile-app/package-lock.json

      - name: Install mobile-app dependencies
        working-directory: clients/mobile-app
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: clients/mobile-app/ios
        run: pod install

      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew install applesimutils

      - name: Install Colima and Docker
        run: |
          brew install colima docker docker-compose
          colima start --cpu 2 --memory 6
          mkdir -p ~/.docker/cli-plugins
          ln -sfn $(brew --prefix)/opt/docker-compose/bin/docker-compose ~/.docker/cli-plugins/docker-compose

      - name: Create .env file for Detox build
        working-directory: clients/mobile-app
        run: |
          cat > .env << 'EOF'
          EXPO_PUBLIC_IDENTITY_URL=http://localhost:8001/api/v1
          EXPO_PUBLIC_SEARCH_URL=http://localhost:8002/api/v1
          EXPO_PUBLIC_ACCOMMODATION_URL=http://localhost:8002/api/v1
          EXPO_PUBLIC_BOOKING_URL=http://localhost:8004/api/v1
          EXPO_PUBLIC_PAYMENT_URL=http://localhost:8005/api/v1
          EXPO_PUBLIC_INVENTORY_URL=http://localhost:8006/api/v1
          EXPO_PUBLIC_WEB_APP_URL=https://d3qrdjfvzz7ms.cloudfront.net
          EOF

      - name: Start identity-service stack
        run: docker compose -f infrastructure/docker/docker-compose.identity.yml up -d --build

      - name: Wait for identity-service to be ready
        run: |
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8001/ready/db >/dev/null; then
              echo "identity-service is ready"
              exit 0
            fi
            sleep 2
          done
          echo "identity-service did not become ready in time"
          docker compose -f infrastructure/docker/docker-compose.identity.yml logs identity-service identity-db
          exit 1

      - name: Build Detox iOS app
        working-directory: clients/mobile-app
        run: npx detox build -c ios.sim.debug

      - name: Boot iPhone 16 simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 16" | grep -v "Plus\|Pro" | head -1 | grep -oE '[A-F0-9-]{36}')
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true

      - name: Run E2E tests on iOS simulator
        working-directory: clients/mobile-app
        run: npm run test:e2e:ios

      - name: Teardown identity-service stack
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.identity.yml down -v

      - name: Upload Detox artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detox-artifacts-ios-${{ github.run_id }}
          path: clients/mobile-app/artifacts/
          retention-days: 14
