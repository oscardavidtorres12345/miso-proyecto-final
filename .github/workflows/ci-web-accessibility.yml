name: CI — Web Accessibility

on:
  push:
    branches: [main, develop]
    paths:
      - "clients/web-app/**"
      - ".github/workflows/ci-web-accessibility.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "clients/web-app/**"
      - ".github/workflows/ci-web-accessibility.yml"

defaults:
  run:
    working-directory: clients/web-app

jobs:
  accessibility:
    name: Accessibility (axe + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: clients/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npm run test:accessibility
        env:
          CI: "true"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report-${{ github.run_id }}
          path: clients/web-app/playwright-report/
          retention-days: 30

      - name: Upload test results (traces/screenshots on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-test-results-${{ github.run_id }}
          path: clients/web-app/test-results/
          retention-days: 14
