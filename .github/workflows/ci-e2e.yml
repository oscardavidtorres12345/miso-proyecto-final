# =============================================================================
# ci-e2e.yml — Pruebas E2E Transversales con Playwright (HU002)
# =============================================================================
# Propósito: validar la integración entre el frontend y los servicios backend.
# Se dispara cuando cambia CUALQUIER servicio relevante o el propio frontend.
#
# Triggers: push a main/develop o PR cuando cambia:
#   - clients/web-app/**        (frontend React)
#   - services/search-service/**
#   - services/identity-service/**
#   - services/booking-service/**
#   - services/hotel-service/**
#   - services/payment-service/**
#
# Modo: corre contra el ambiente desplegado en AWS (BASE_URL).
#   No necesita levantar Vite ni Docker — apunta directo a CloudFront.
#
# Playwright config ya soporta BASE_URL:
#   - Sin BASE_URL → levanta Vite dev server (local)
#   - Con BASE_URL  → apunta al ambiente remoto (CI/CD)
# =============================================================================

name: CI — E2E Tests (HU002)

on:
  push:
    branches: [main, develop]
    paths:
      - "clients/web-app/**"
      - "services/search-service/**"
      - "services/identity-service/**"
      - "services/booking-service/**"
      - "services/hotel-service/**"
      - "services/payment-service/**"
      - ".github/workflows/ci-e2e.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "clients/web-app/**"
      - "services/search-service/**"
      - "services/identity-service/**"
      - "services/booking-service/**"
      - "services/hotel-service/**"
      - "services/payment-service/**"
      - ".github/workflows/ci-e2e.yml"

jobs:
  e2e:
    name: E2E — Playwright (HU002 BDD)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients/web-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (BDD Given/When/Then)
        run: npm run test:e2e
        env:
          BASE_URL: ${{ vars.CLOUDFRONT_URL || 'https://d3683sivhp74is.cloudfront.net' }}
          CI: "true"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: clients/web-app/playwright-report/
          retention-days: 30

      - name: Upload Playwright test results (traces/screenshots on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: clients/web-app/test-results/
          retention-days: 14

