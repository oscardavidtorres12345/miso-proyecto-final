# =============================================================================
# ci-payment-service.yml — CI para Payment Service
# =============================================================================
# Triggers: push o PR que toque services/payment-service/**
#
# Jobs:
#   1. unit-tests — pytest con coverage > 70% (bloquea merge si falla)
#
# Status check para proteger main/develop:
#   Settings → Branches → main → Required status checks:
#     "CI — Payment Service / Unit & Integration Tests"
# =============================================================================

name: CI — Payment Service

on:
  push:
    paths:
      - "services/payment-service/**"
      - ".github/workflows/ci-payment-service.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/payment-service/**"
      - ".github/workflows/ci-payment-service.yml"

env:
  SERVICE_PATH: services/payment-service

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/payment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "services/payment-service/requirements.txt"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run pytest with coverage (threshold > 70%)
        run: |
          python -m pytest tests/ \
            --tb=short \
            --junitxml=reports/junit.xml \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-fail-under=70 \
            -v

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-payment-report-${{ github.run_id }}
          path: services/payment-service/reports/junit.xml
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-payment-service-${{ github.run_id }}
          path: services/payment-service/reports/coverage.xml
          retention-days: 30
