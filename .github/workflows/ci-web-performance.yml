name: CI - Web Performance

on:
  push:
    branches: [main, develop]
    paths:
      - 'clients/web-app/**'
      - '.github/workflows/ci-web-performance.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'clients/web-app/**'
    types: [opened, synchronize, reopened]

jobs:
  # ─── Job 1: Build ────────────────────────────────────────────────────────────
  build:
    name: Build Web App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clients/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app-dist
          path: clients/web-app/dist
          retention-days: 1

  # ─── Job 2: Playwright + Lighthouse (Core Web Vitals por página) ─────────────
  playwright-lighthouse:
    name: Playwright Lighthouse — Core Web Vitals
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: clients/web-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: clients/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app-dist
          path: clients/web-app/dist

      - name: Run performance tests (Playwright + Lighthouse)
        run: npm run test:performance
        env:
          CI: "true"

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-lighthouse-report
          path: clients/web-app/performance-report
          retention-days: 30

