# =============================================================================
# ci-e2e-hu004.yml — Pruebas E2E HU004: Detalle de hospedaje y carrito
# =============================================================================
# Propósito: validar los flujos de visualización de detalle de propiedad,
# selección de habitación y carrito de reserva (E011–E017).
#
# Triggers: push a main/develop o PR cuando cambia:
#   - clients/web-app/**         (frontend React)
#   - services/search-service/** (detalle de hospedaje via /api/v1/hotels/{id})
#   - services/booking-service/**
#   - services/payment-service/**
#
# Modo: corre contra el ambiente desplegado en AWS (BASE_URL → CloudFront).
# Los tests tienen skip-graceful si el backend no está disponible.
#
# Status check para proteger main/develop:
#   Settings → Branches → main → Required status checks:
#     "CI — E2E Tests (HU004) / E2E — Playwright (HU004 BDD)"
# =============================================================================

name: CI — E2E Tests (HU004)

on:
  push:
    branches: [main, develop]
    paths:
      - "clients/web-app/**"
      - "services/search-service/**"
      - "services/booking-service/**"
      - "services/payment-service/**"
      - ".github/workflows/ci-e2e-hu004.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "clients/web-app/**"
      - "services/search-service/**"
      - "services/booking-service/**"
      - "services/payment-service/**"
      - ".github/workflows/ci-e2e-hu004.yml"

jobs:
  e2e:
    name: E2E — Playwright (HU004 BDD)
    runs-on: ubuntu-latest
    # Hard cap: 15 min. 7 tests × 1 retry × 15s timeout ≈ 4-5 min cuando la app está arriba.
    timeout-minutes: 15

    defaults:
      run:
        working-directory: clients/web-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/web-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (HU004 BDD — E011 to E017)
        run: npm run test:e2e -- tests/e2e/HU004/
        env:
          BASE_URL: ${{ vars.CLOUDFRONT_URL || 'https://d3683sivhp74is.cloudfront.net' }}
          CI: "true"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hu004-${{ github.run_id }}
          path: clients/web-app/playwright-report/
          retention-days: 30

      - name: Upload Playwright test results (traces/screenshots on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-hu004-${{ github.run_id }}
          path: clients/web-app/test-results/
          retention-days: 14
