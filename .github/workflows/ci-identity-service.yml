name: CI — Identity Service

on:
  push:
    paths:
      - "services/identity-service/**"
      - ".github/workflows/ci-identity-service.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/identity-service/**"
      - ".github/workflows/ci-identity-service.yml"

jobs:
  unit-tests:
    name: Security & Unit Tests (Identity)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/identity-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "services/identity-service/requirements.txt"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run identity tests (audit + retry blocking)
        run: |
          mkdir -p reports
          PYTHONPATH=. python -m pytest tests/unit \
            --tb=short \
            --junitxml=reports/junit.xml \
            -v

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-pytest-report-${{ github.run_id }}
          path: services/identity-service/reports/junit.xml
          retention-days: 30
