# =============================================================================
# ci-identity-service.yml — CI para Identity Service
# =============================================================================
# Triggers: push o PR que toque services/identity-service/**
#
# Jobs:
#   1. unit-tests — pytest con coverage > 70% (bloquea merge si falla)
#   2. integration-endpoint-tests — Docker + PostgreSQL (after unit-tests)
#
# Status check para proteger main/develop:
#   Settings → Branches → main → Required status checks:
#     "CI — Identity Service / Unit & Integration Tests"
# =============================================================================

name: CI — Identity Service

on:
  push:
    paths:
      - "services/identity-service/**"
      - "infrastructure/docker/**"
      - ".github/workflows/ci-identity-service.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "services/identity-service/**"
      - "infrastructure/docker/**"
      - ".github/workflows/ci-identity-service.yml"

env:
  SERVICE_PATH: services/identity-service

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/identity-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "services/identity-service/requirements.txt"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Run pytest with coverage (threshold > 70%)
        run: |
          mkdir -p reports
          PYTHONPATH=. python -m pytest tests/unit/ \
            --tb=short \
            --junitxml=reports/junit.xml \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml \
            --cov-fail-under=70 \
            -v

      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-identity-report-${{ github.run_id }}
          path: services/identity-service/reports/junit.xml
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-identity-service-${{ github.run_id }}
          path: services/identity-service/reports/coverage.xml
          retention-days: 30

  integration-endpoint-tests:
    name: Endpoint Integration Tests (Docker + PostgreSQL)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "services/identity-service/requirements.txt"

      - name: Install dependencies
        working-directory: services/identity-service
        run: pip install --quiet -r requirements.txt

      - name: Start identity stack (db + service)
        run: docker compose -f infrastructure/docker/docker-compose.identity.yml up -d --build

      - name: Wait for identity service readiness
        run: |
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8001/ready/db >/dev/null; then
              echo "identity-service is ready"
              exit 0
            fi
            sleep 2
          done
          echo "identity-service did not become ready in time"
          docker compose -f infrastructure/docker/docker-compose.identity.yml logs identity-service identity-db
          exit 1

      - name: Run endpoint integration tests
        working-directory: services/identity-service
        env:
          IDENTITY_API_BASE_URL: http://127.0.0.1:8001/api/v1
        run: |
          mkdir -p reports
          PYTHONPATH=. python -m pytest tests/integration \
            --tb=short \
            --junitxml=reports/junit-integration.xml \
            -v

      - name: Upload integration JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-integration-pytest-report-${{ github.run_id }}
          path: services/identity-service/reports/junit-integration.xml
          retention-days: 30

      - name: Teardown identity stack
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.identity.yml down -v
