# =============================================================================
# cd.yml — Continuous Deployment: detecta cambios por servicio → build Docker
#           → push ECR → rolling update en EKS (travelhub-dev)
# =============================================================================
#
# Triggers: push a develop o main cuando cambia algún servicio
#
# Jobs:
#   1. changes     — dorny/paths-filter detecta qué servicios cambiaron
#   2. deploy-*    — uno por servicio, corre en PARALELO, solo si ese servicio cambió
#                    Llama al workflow reutilizable _build-deploy.yml
#
# GitHub Secrets requeridos (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID      — clave de acceso IAM con permisos ECR + EKS
#   AWS_SECRET_ACCESS_KEY  — clave secreta IAM
#
# El IAM user/role necesita estas políticas:
#   - AmazonEC2ContainerRegistryPowerUser  (push a ECR)
#   - eksFullAccess o permiso de kubectl   (kubectl set image)
# =============================================================================

name: CD — Build & Deploy to EKS

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "clients/web-app/**"
      - "infrastructure/kubernetes/ingress/**"
      - ".github/workflows/cd.yml"
      - ".github/workflows/_build-deploy.yml"
  # Permite disparar el deploy manualmente desde GitHub Actions → Run workflow
  workflow_dispatch:
    inputs:
      force_all:
        description: "Desplegar TODOS los servicios aunque no hayan cambiado"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  # ── 1. Detectar qué servicios cambiaron ──────────────────────────────────
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      search:     ${{ steps.filter.outputs.search }}
      identity:   ${{ steps.filter.outputs.identity }}
      booking:    ${{ steps.filter.outputs.booking }}
      payment:    ${{ steps.filter.outputs.payment }}
      inventory:  ${{ steps.filter.outputs.inventory }}
      web_app:    ${{ steps.filter.outputs.web_app }}
      ingress:    ${{ steps.filter.outputs.ingress }}
      mobile_app: ${{ steps.filter.outputs.mobile_app }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed paths per service
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            search:
              - 'services/search-service/**'
            identity:
              - 'services/identity-service/**'
            booking:
              - 'services/booking-service/**'
            payment:
              - 'services/payment-service/**'
            inventory:
              - 'services/inventory-service/**'
            web_app:
              - 'clients/web-app/**'
            ingress:
              - 'infrastructure/kubernetes/ingress/**'
            mobile_app:
              - 'clients/mobile-app/**'

  # ── 2. Build + Deploy en paralelo — solo los servicios que cambiaron ─────

  deploy-search:
    name: search-service
    needs: changes
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.search == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: search-service
      ecr_repo: travelhub/search-service
    secrets: inherit

  deploy-identity:
    name: identity-service
    needs: changes
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.identity == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: identity-service
      ecr_repo: travelhub/identity-service
    secrets: inherit

  deploy-booking:
    name: booking-service
    needs: changes
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.booking == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: booking-service
      ecr_repo: travelhub/booking-service
    secrets: inherit

  deploy-payment:
    name: payment-service
    needs: changes
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.payment == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: payment-service
      ecr_repo: travelhub/payment-service
    secrets: inherit

  deploy-inventory:
    name: inventory-service
    needs: changes
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.inventory == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: inventory-service
      ecr_repo: travelhub/inventory-service
    secrets: inherit

  deploy-web-app:
    name: web-app
    needs: changes
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.web_app == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: web-app
      ecr_repo: travelhub/web-app
      source_path: clients/web-app
      cloudfront_url: "https://d3sxrxy8icsofs.cloudfront.net"
    secrets: inherit

  # ── 3. Build APK release (mobile-app) — sube artifact para pruebas manuales ──
  build-mobile-release:
    name: Build Mobile Release APK
    needs: changes
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.mobile_app == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: clients/mobile-app/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile-app dependencies
        working-directory: clients/mobile-app
        run: npm ci

      - name: Prepare production .env
        working-directory: clients/mobile-app
        run: cp .env.production .env

      - name: Bake API URLs directly into source code
        working-directory: clients/mobile-app
        run: |
          cat > src/config/api.ts << 'EOF'
          export const API_CONFIG = {
            IDENTITY_URL: 'https://d3sxrxy8icsofs.cloudfront.net/api/v1/identity',
            SEARCH_URL: 'https://d3sxrxy8icsofs.cloudfront.net/api/v1/search',
            ACCOMMODATION_URL: 'https://d3sxrxy8icsofs.cloudfront.net/api/v1/hotels',
            BOOKING_URL: 'https://d3sxrxy8icsofs.cloudfront.net/api/v1/bookings',
            WEB_APP_URL: 'https://d3sxrxy8icsofs.cloudfront.net',
          } as const;
          EOF

      - name: Build Android release APK
        working-directory: clients/mobile-app/android
        run: ./gradlew assembleRelease

      - name: Verify API URLs baked into JS bundle
        working-directory: clients/mobile-app/android
        run: |
          BUNDLE="app/build/generated/assets/react/release/index.android.bundle"
          if grep -q "d3sxrxy8icsofs.cloudfront.net/api/v1" "$BUNDLE"; then
            echo "✅ API URLs found baked into release bundle"
          else
            echo "❌ API URLs NOT found in release bundle"
            exit 1
          fi

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-app-release-apk
          path: clients/mobile-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  # ── 4. Sincronizar Ingress — aplica el YAML al cluster cuando cambia ─────
  # Corre DESPUÉS de todos los deploys para que las rutas nuevas apunten
  # a servicios que ya existen. También se fuerza con force_all=true.
  sync-ingress:
    name: Sync Kubernetes Ingress
    needs: [changes, deploy-search, deploy-identity, deploy-booking, deploy-payment, deploy-inventory, deploy-web-app]
    # Ejecutar si: el ingress.yaml cambió, se desplegó el web-app (nueva ruta),
    # o se forzó el deploy completo. always() permite correr aunque jobs anteriores
    # hayan sido skipped (if: false).
    if: |
      always() && (
        github.event.inputs.force_all == 'true' ||
        needs.changes.outputs.ingress == 'true' ||
        needs.changes.outputs.web_app == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name travelhub-dev \
            --region us-east-1

      - name: Apply Ingress to cluster
        run: |
          kubectl apply -f infrastructure/kubernetes/ingress/ingress.yaml -n travelhub
          echo "✅ Ingress synced:"
          kubectl get ingress travelhub-ingress -n travelhub

