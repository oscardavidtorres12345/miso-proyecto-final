# =============================================================================
# cd.yml — Continuous Deployment: detecta cambios por servicio → build Docker
#           → push ECR → rolling update en EKS (travelhub-dev)
# =============================================================================
#
# Triggers: push a develop o main cuando cambia algún servicio
#
# Jobs:
#   1. changes     — dorny/paths-filter detecta qué servicios cambiaron
#   2. deploy-*    — uno por servicio, corre en PARALELO, solo si ese servicio cambió
#                    Llama al workflow reutilizable _build-deploy.yml
#
# GitHub Secrets requeridos (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID      — clave de acceso IAM con permisos ECR + EKS
#   AWS_SECRET_ACCESS_KEY  — clave secreta IAM
#
# El IAM user/role necesita estas políticas:
#   - AmazonEC2ContainerRegistryPowerUser  (push a ECR)
#   - eksFullAccess o permiso de kubectl   (kubectl set image)
# =============================================================================

name: CD — Build & Deploy to EKS

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "clients/web-app/**"
      - "infrastructure/kubernetes/ingress/**"
      - ".github/workflows/cd.yml"
      - ".github/workflows/_build-deploy.yml"
  # Permite disparar el deploy manualmente desde GitHub Actions → Run workflow
  workflow_dispatch:
    inputs:
      force_all:
        description: "Desplegar TODOS los servicios aunque no hayan cambiado"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

jobs:
  # ── 1. Detectar qué servicios cambiaron ──────────────────────────────────
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      search:   ${{ steps.filter.outputs.search }}
      identity: ${{ steps.filter.outputs.identity }}
      booking:  ${{ steps.filter.outputs.booking }}
      hotel:    ${{ steps.filter.outputs.hotel }}
      payment:  ${{ steps.filter.outputs.payment }}
      web_app:  ${{ steps.filter.outputs.web_app }}
      ingress:  ${{ steps.filter.outputs.ingress }}
      currency: ${{ steps.filter.outputs.currency }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed paths per service
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            search:
              - 'services/search-service/**'
            identity:
              - 'services/identity-service/**'
            booking:
              - 'services/booking-service/**'
            hotel:
              - 'services/hotel-service/**'
            payment:
              - 'services/payment-service/**'
            web_app:
              - 'clients/web-app/**'
            ingress:
              - 'infrastructure/kubernetes/ingress/**'
            currency:
              - 'services/currency-service/**'

  # ── 2. Build + Deploy en paralelo — solo los servicios que cambiaron ─────

  deploy-search:
    name: search-service
    needs: changes
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.search == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: search-service
      ecr_repo: travelhub/search-service
    secrets: inherit

  deploy-identity:
    name: identity-service
    needs: changes
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.identity == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: identity-service
      ecr_repo: travelhub/identity-service
    secrets: inherit

  deploy-booking:
    name: booking-service
    needs: changes
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.booking == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: booking-service
      ecr_repo: travelhub/booking-service
    secrets: inherit

  deploy-hotel:
    name: hotel-service
    needs: changes
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.hotel == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: hotel-service
      ecr_repo: travelhub/hotel-service
    secrets: inherit

  deploy-payment:
    name: payment-service
    needs: changes
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.payment == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: payment-service
      ecr_repo: travelhub/payment-service
    secrets: inherit

  deploy-web-app:
    name: web-app
    needs: changes
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.web_app == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: web-app
      ecr_repo: travelhub/web-app
      source_path: clients/web-app
    secrets: inherit

  # ── 3. Sincronizar Ingress — aplica el YAML al cluster cuando cambia ─────
  # Corre DESPUÉS de todos los deploys para que las rutas nuevas apunten
  # a servicios que ya existen. También se fuerza con force_all=true.
  sync-ingress:
    name: Sync Kubernetes Ingress
    needs: [changes, deploy-search, deploy-identity, deploy-booking, deploy-hotel, deploy-payment, deploy-web-app]
    # Ejecutar si: el ingress.yaml cambió, se desplegó el web-app (nueva ruta),
    # o se forzó el deploy completo. always() permite correr aunque jobs anteriores
    # hayan sido skipped (if: false).
    if: |
      always() && (
        github.event.inputs.force_all == 'true' ||
        needs.changes.outputs.ingress == 'true' ||
        needs.changes.outputs.web_app == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name travelhub-dev \
            --region us-east-1

      - name: Apply Ingress to cluster
        run: |
          kubectl apply -f infrastructure/kubernetes/ingress/ingress.yaml -n travelhub
          echo "✅ Ingress synced:"
          kubectl get ingress travelhub-ingress -n travelhub

  # ── currency-service: primero sincroniza K8s secrets desde AWS Secrets Manager,
  #    luego despliega. Mismo patrón que los secrets de DB.
  #
  # Secrets Manager paths (creados por Terraform en secrets.tf / rds module):
  #   travelhub/dev/db/currency_db   → DATABASE_URL  → K8s secret: currency-service-db
  #   travelhub/dev/ext/apilayer     → APILAYER_API_KEY → K8s secret: currency-service-apilayer
  #
  # Ningún secret viaja como variable en este yml ni en los Helm values.
  # Usa --dry-run=client | kubectl apply → completamente idempotente.
  setup-currency-secrets:
    name: Setup currency-service K8s secrets
    runs-on: ubuntu-latest
    needs: changes
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.currency == 'true'
    env:
      AWS_REGION: us-east-1
      EKS_CLUSTER: travelhub-dev
      K8S_NAMESPACE: travelhub

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Sync currency-service-db K8s secret from Secrets Manager
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id travelhub/dev/db/currency_db \
            --query SecretString --output text)

          # Convierte postgresql:// → postgresql+psycopg:// para SQLAlchemy sync
          DB_URL=$(echo "$SECRET_JSON" | python3 -c "
          import sys, json
          s = json.load(sys.stdin)
          print(s['url'].replace('postgresql://', 'postgresql+psycopg://'))
          ")

          kubectl create secret generic currency-service-db \
            --from-literal=DATABASE_URL="$DB_URL" \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ currency-service-db synced from travelhub/dev/db/currency_db"

      - name: Sync currency-service-apilayer K8s secret from Secrets Manager
        run: |
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id travelhub/dev/ext/apilayer \
            --query SecretString --output text)

          API_KEY=$(echo "$SECRET_JSON" | python3 -c "
          import sys, json
          s = json.load(sys.stdin)
          print(s['api_key'])
          ")

          kubectl create secret generic currency-service-apilayer \
            --from-literal=APILAYER_API_KEY="$API_KEY" \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "✅ currency-service-apilayer synced from travelhub/dev/ext/apilayer"

  deploy-currency:
    name: currency-service
    needs: [changes, setup-currency-secrets]
    if: github.event.inputs.force_all == 'true' || needs.changes.outputs.currency == 'true'
    uses: ./.github/workflows/_build-deploy.yml
    with:
      service: currency-service
      ecr_repo: travelhub/currency-service
    secrets: inherit

