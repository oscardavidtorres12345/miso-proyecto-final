version: "3.9"

# =============================================================================
# docker-compose.ci.yml — Stack simplificado para GitHub Actions (CI)
#
# Diferencias con docker-compose.yml (produccion):
#   - Un solo PostgreSQL (db-primary). No hay replica de streaming.
#   - READ_REPLICA_URL apunta al mismo primary → todo el codigo de replica
#     se ejercita, pero sin la complejidad de configurar pg_basebackup en CI.
#   - Sin POSTGRES_INITDB_ARGS (eran invalidos y rompian la inicializacion).
#   - Puertos fijos para que el healthcheck del workflow y el seed funcionen.
# =============================================================================

services:
  search-service:
    build: .
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://travelhub:travelhub@db-primary:5432/search_db
      # Apunta al mismo primary: el codigo de replica se ejercita sin WAL real
      READ_REPLICA_URL: postgresql+asyncpg://travelhub:travelhub@db-primary:5432/search_db
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: "300"
    depends_on:
      db-primary:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app

  # ── PostgreSQL (unico nodo, actua como primary y replica en CI) ───────────
  db-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travelhub
      POSTGRES_PASSWORD: travelhub
      POSTGRES_DB: search_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelhub -d search_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (Cache-Aside, TTL=300s) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru

