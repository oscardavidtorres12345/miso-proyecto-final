apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: travelhub
data:
  nginx.conf: |
    events {}
    http {
        # ── Resolver Kubernetes DNS (CoreDNS en EKS) ─────────────────────────
        # 172.20.0.10 es la IP del servicio kube-dns en EKS (service CIDR
        # 172.20.0.0/16). El resolver permite que nginx resuelva el upstream
        # de forma LAZY (en cada request) en vez de al arrancar, evitando el
        # error "host not found in upstream" y el CrashLoopBackOff del gateway
        # cuando payment-service aún no está listo.
        resolver 172.20.0.10 valid=5s ipv6=off;
        resolver_timeout 5s;

        server {
            listen 80;
            location / {
                # Variable fuerza resolución lazy: nginx no falla en startup
                # aunque payment-service no esté listo todavía.
                set $upstream http://payment-service:80;
                proxy_pass $upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Client-IP $http_x_client_ip;
                proxy_connect_timeout 5s;
                proxy_read_timeout    60s;
            }
            location /health {
                return 200 "ok\n";
                add_header Content-Type text/plain;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: travelhub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-config
        configMap:
          name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: travelhub
  annotations:
    # EKS provisiona un Classic Load Balancer de AWS automáticamente
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  # LoadBalancer en EKS → AWS crea un NLB con IP pública
  type: LoadBalancer

