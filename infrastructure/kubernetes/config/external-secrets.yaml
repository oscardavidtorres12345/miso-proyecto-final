---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: booking-service-db
  namespace: travelhub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: booking-service-db
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: travelhub/dev/db/booking_db
        property: url
