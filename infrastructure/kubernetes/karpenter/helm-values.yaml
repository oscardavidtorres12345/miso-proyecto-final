# =============================================================================
# Helm values para Karpenter (oci://public.ecr.aws/karpenter/karpenter)
# Requiere: Karpenter >= 1.0
# =============================================================================

controller:
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

serviceAccount:
  create: true
  name: karpenter
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::442042525047:role/travelhub-dev-karpenter-controller"

settings:
  clusterName: "travelhub-dev"
  clusterEndpoint: "https://A158DD56EB2E0024C45C0502BABC9053.gr7.us-east-1.eks.amazonaws.com"
  interruptionQueue: "travelhub-dev-karpenter-interruption"
  aws:
    defaultInstanceProfile: "travelhub-dev-karpenter-node"
