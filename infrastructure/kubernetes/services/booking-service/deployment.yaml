apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: travelhub
  labels:
    app: booking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: 442042525047.dkr.ecr.us-east-1.amazonaws.com/travelhub/booking-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: booking-service-db
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: booking-service-redis
                  key: REDIS_URL
            - name: SQS_BOOKING_EVENTS_URL
              valueFrom:
                configMapKeyRef:
                  name: travelhub-config
                  key: SQS_BOOKING_EVENTS_URL
            - name: ENVIRONMENT
              value: "production"
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:8000"
            - name: IDENTITY_SERVICE_URL
              value: "http://identity-service:8000"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8000"
            - name: SEARCH_SERVICE_URL
              value: "http://search-service:8000"
            - name: BOOKING_EMAIL_ENABLED
              value: "true"
            - name: BOOKING_SMTP_HOST
              value: "smtp.gmail.com"
            - name: BOOKING_SMTP_PORT
              value: "587"
            - name: BOOKING_SMTP_STARTTLS
              value: "true"
            - name: BOOKING_SMTP_AUTH_ENABLED
              value: "true"
            - name: BOOKING_SMTP_USER
              value: "travelhubnotifications@gmail.com"
            - name: BOOKING_SMTP_FROM
              value: "travelhubnotifications@gmail.com"
            - name: BOOKING_SMTP_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: booking-service-smtp
                  key: BOOKING_SMTP_APP_PASSWORD
            - name: BOOKING_PUSH_ENABLED
              value: "true"
            - name: FIREBASE_SERVICE_ACCOUNT_PATH
              value: "/etc/firebase/service-account.json"
          volumeMounts:
            - name: firebase-service-account
              mountPath: /etc/firebase
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: firebase-service-account
          secret:
            secretName: firebase-service-account
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: travelhub
spec:
  selector:
    app: booking-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-service-hpa
  namespace: travelhub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-service
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 4
          periodSeconds: 15
        - type: Percent
          value: 100
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

