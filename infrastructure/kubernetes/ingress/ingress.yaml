apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travelhub-ingress
  namespace: travelhub
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Search Service
          - path: /api/v1/search
            pathType: Prefix
            backend:
              service:
                name: search-service
                port:
                  number: 8000

          # Identity Service
          - path: /api/v1/identity
            pathType: Prefix
            backend:
              service:
                name: identity-service
                port:
                  number: 8000

          # Hotels (search-service)
          - path: /api/v1/hotels
            pathType: Prefix
            backend:
              service:
                name: identity-service
                port:
                  number: 8000

          # Booking Service
          - path: /api/v1/bookings
            pathType: Prefix
            backend:
              service:
                name: booking-service
                port:
                  number: 8000

          # Payment Service
          - path: /api/v1/payments
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 8000

          # Inventory Service
          - path: /api/v1/inventory
            pathType: Prefix
            backend:
              service:
                name: search-service
                port:
                  number: 8000

          # Web App — SPA (root path, must be last)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-app
                port:
                  number: 80

