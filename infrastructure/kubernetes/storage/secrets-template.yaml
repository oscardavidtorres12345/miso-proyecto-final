# ──────────────────────────────────────────────────────────────────────────────
# secrets-template.yaml
# Aplicado automáticamente por Terraform (null_resource.external_secrets_operator)
# después de instalar el External Secrets Operator via Helm.
# El ClusterSecretStore está en: kubernetes/config/cluster-secret-store.yaml
# ──────────────────────────────────────────────────────────────────────────────

# ExternalSecret for search-service DB credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: search-service-db
  namespace: travelhub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: search-service-db
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: travelhub/dev/db/search_db
        property: url

