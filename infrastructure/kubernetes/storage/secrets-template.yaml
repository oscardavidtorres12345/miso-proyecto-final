# ──────────────────────────────────────────────────────────────────────────────
# secrets-template.yaml  —  DO NOT apply this file directly.
# Real secrets are managed via AWS Secrets Manager + External Secrets Operator.
# This file shows the expected structure for local development only.
# ──────────────────────────────────────────────────────────────────────────────

# External Secrets ClusterSecretStore — reads from AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets

---
# ExternalSecret for search-service DB credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: search-service-db
  namespace: travelhub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: search-service-db
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: travelhub/dev/db/search_db
        property: url

