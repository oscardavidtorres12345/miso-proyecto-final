image:
  repository: travelhub/search-service

hpa:
  memoryUtilization: 80

envVars:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"

envFromSecrets:
  - envName: DATABASE_URL
    secretName: search-service-db
    secretKey: DATABASE_URL
  - envName: REDIS_URL
    secretName: search-service-redis
    secretKey: REDIS_URL
  - envName: INTERNAL_API_TOKEN
    secretName: travelhub-internal
    secretKey: INTERNAL_API_TOKEN
