version: "3.9"

services:
  identity-db:
    build:
      context: .
      dockerfile: ./identity-db/Dockerfile
    container_name: identity-db
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - identity_db_data:/var/lib/postgresql/data

  identity-service:
    build: ../../services/identity-service
    container_name: identity-service
    depends_on:
      identity-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@identity-db:5432/identity_db
    ports:
      - "8001:8000"

volumes:
  identity_db_data:
